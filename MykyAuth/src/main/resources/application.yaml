server:
  port: ${SERVER_PORT:9000}

spring:

  application:
    name: MykyAuth

  liquibase:
    enabled: true
    change-log: classpath:/db/changelog/db.changelog-master.yaml

  datasource:
    hikari:
      auto-commit: true
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
    driver-class-name: ${DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update

  security:
    jwt:
      access-token:
        secret: ${ACCESS_TOKEN_SECRET:secretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecret}
        exp-min: ${ACCESS_TOKEN_EXP_MIN:10}
      refresh-token:
        secret: ${REFRESH_TOKEN_SECRET:secretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecretsecret}
        exp-days: ${REFRESH_TOKEN_EXP_DAYS:10}
      cookie:
        same-site: ${COOKIE_SAME_SITE:Lax}
        secure: ${COOKIE_SECURE:false}
        http-only: ${COOKIE_HTTP_ONLY:true}
        path: ${COOKIE_PATH:/}
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER:localhost:9000}
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email

    cors:
      allowed_origins: ${ALLOWED_ORIGINS:http://localhost:3000}


  config:
    import: optional:file:.env[.properties]

app:
  feature:
    rest:
      enabled: ${ENABLE_REST:false}